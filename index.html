
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flipper Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🪙 Coin Flipper</h1>
        <p class="subtitle">Let's test your luck!</p>

        <div class="coin-container">
            <div class="coin" id="coin">

                <div class="heads">H</div>
                <div class="tails">T</div>

            </div>
        </div>

        <button id="flipBtn" onclick="flipCoin()">
            Flip The Coin
        </button>

        <h2 id="result">Ready to Flip?</h2>

        <p class="message" id="message">
            Click the button and see what you get!
        </p>

    </div>

    <script src="script.js"></script>
</body>
</html>
